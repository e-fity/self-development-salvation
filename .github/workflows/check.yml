name: check

on:
  push:
  pull_request:

jobs:
  static:
    name: 静态门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 不需要 Godot：Python 语法、JSON 规范化、文本卫生、GDScript 基础规则
      - name: Run static checks
        run: python tools/check.py
